name: Actualización Periódica CABA (Smart Sweep)

on:
  schedule:
    # Corre todos los días a las 06:00 y 18:00 UTC (03:00 y 15:00 hs de Argentina)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub con un clic

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install httpx beautifulsoup4 sqlalchemy fastapi pydantic uvicorn

      - name: Ejecutar Barrido Quirúrgico CABA
        run: |
          python caba_smart_sweep.py

      - name: Commitear y Push de la Base Actualizada
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/inmuebles.db
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en la base de datos."
          else
            git commit -m "chore(data): Actualización periódica automática de inmuebles CABA [skip ci]"
            git push
          fi
