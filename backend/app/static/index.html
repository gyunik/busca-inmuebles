<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca Inmuebles | Agregador CABA & GBA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    body { background-color: #ededed; color: #333333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    
    /* Pastillas de precio Zonaprop style */
    .price-pill {
      background-color: #ff5a00;
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      border: 1.5px solid #ffffff;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      display: inline-block;
    }
    .price-pill:hover {
      transform: scale(1.15);
      background-color: #e04e00;
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
      z-index: 9999 !important;
    }
    .fav-pill {
      background-color: #e11d48 !important;
    }
    .selected-pill {
      background-color: #2563eb !important;
      transform: scale(1.18);
    }
    .custom-price-marker {
      background: transparent;
      border: none;
    }
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const API_BASE = '/api';

    const NEIGHBORHOOD_COORDS = {
      // CABA
      "Agronomía": [-34.5936, -58.4878],
      "Almagro": [-34.6105, -58.4230],
      "Balvanera": [-34.6100, -58.4000],
      "Barracas": [-34.6468, -58.3833],
      "Belgrano": [-34.5627, -58.4568],
      "Boedo": [-34.6300, -58.4167],
      "Caballito": [-34.6186, -58.4428],
      "Chacarita": [-34.5878, -58.4556],
      "Coghlan": [-34.5667, -58.4750],
      "Colegiales": [-34.5772, -58.4489],
      "Constitución": [-34.6267, -58.3833],
      "Flores": [-34.6333, -58.4667],
      "Floresta": [-34.6333, -58.4833],
      "La Boca": [-34.6345, -58.3631],
      "La Paternal": [-34.5989, -58.4689],
      "Liniers": [-34.6467, -58.5167],
      "Mataderos": [-34.6600, -58.5000],
      "Monserrat": [-34.6133, -58.3811],
      "Montserrat": [-34.6133, -58.3811],
      "Monte Castro": [-34.6217, -58.5067],
      "Nueva Pompeya": [-34.6500, -58.4167],
      "Núñez": [-34.5458, -58.4628],
      "Palermo": [-34.5889, -58.4306],
      "Parque Avellaneda": [-34.6500, -58.4750],
      "Parque Chacabuco": [-34.6333, -58.4417],
      "Parque Chas": [-34.5850, -58.4800],
      "Parque Patricios": [-34.6389, -58.4056],
      "Puerto Madero": [-34.6100, -58.3600],
      "Recoleta": [-34.5889, -58.3944],
      "Retiro": [-34.5928, -58.3756],
      "Saavedra": [-34.5500, -58.4900],
      "San Cristóbal": [-34.6222, -58.4000],
      "San Nicolás": [-34.6039, -58.3817],
      "San Telmo": [-34.6211, -58.3731],
      "Versalles": [-34.6250, -58.5250],
      "Villa Crespo": [-34.5994, -58.4439],
      "Villa del Parque": [-34.6056, -58.4917],
      "Villa Devoto": [-34.6000, -58.5125],
      "Villa General Mitre": [-34.6111, -58.4722],
      "Villa Lugano": [-34.6750, -58.4750],
      "Villa Luro": [-34.6389, -58.5028],
      "Villa Ortúzar": [-34.5806, -58.4722],
      "Villa Pueyrredón": [-34.5778, -58.5056],
      "Villa Real": [-34.6167, -58.5250],
      "Villa Riachuelo": [-34.6861, -58.4611],
      "Villa Santa Rita": [-34.6167, -58.4833],
      "Villa Soldati": [-34.6667, -58.4417],
      "Villa Urquiza": [-34.5722, -58.4889],
      "Vélez Sársfield": [-34.6300, -58.4800],
      // GBA
      "Vicente López": [-34.5292, -58.4722],
      "Olivos": [-34.5111, -58.4889],
      "San Isidro": [-34.4722, -58.5278],
      "Martínez": [-34.4944, -58.5111],
      "Tigre": [-34.4250, -58.5792],
      "San Fernando": [-34.4444, -58.5556],
      "San Martín": [-34.5750, -58.5361],
      "Tres de Febrero": [-34.6000, -58.5667],
      "Morón": [-34.6500, -58.6167],
      "Ramos Mejía": [-34.6472, -58.5639],
      "Castelar": [-34.6583, -58.6417],
      "Ituzaingó": [-34.6583, -58.6667],
      "Avellaneda": [-34.6611, -58.3667],
      "Lanús": [-34.7000, -58.3917],
      "Quilmes": [-34.7167, -58.2583],
      "Lomas de Zamora": [-34.7611, -58.4000],
      "Banfield": [-34.7417, -58.3917],
      "Temperley": [-34.7722, -58.3944]
    };

    function formatPricePill(price) {
      if (!price) return 'Consultar';
      if (price >= 1000000) {
        const val = (price / 1000000).toFixed(1).replace('.0', '');
        return `USD ${val}M`;
      }
      if (price >= 1000) {
        const val = Math.round(price / 1000);
        return `USD ${val}K`;
      }
      return `USD ${price}`;
    }

    function App() {
      const [properties, setProperties] = useState([]);
      const [total, setTotal] = useState(0);
      const [totalPages, setTotalPages] = useState(1);
      const [loading, setLoading] = useState(true);
      const [catalog, setCatalog] = useState({});
      const [stats, setStats] = useState(null);
      const [isScrapeModalOpen, setIsScrapeModalOpen] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [viewMode, setViewMode] = useState('split'); // 'list', 'split', 'map'
      const [selectedPropertyId, setSelectedPropertyId] = useState(null);

      const [filters, setFilters] = useState({
        property_types: [],
        neighborhoods: [],
        zones: [],
        portals: [],
        min_price: undefined,
        max_price: undefined,
        min_area: undefined,
        max_area: undefined,
        min_bedrooms: undefined,
        max_bedrooms: undefined,
        min_bathrooms: undefined,
        days_ago: undefined,
        date_filter: '',
        search_query: '',
        only_favorites: false,
        group_duplicates: false,
        sort_by: 'newest',
        page: 1,
        page_size: 150
      });

      const [searchInputValue, setSearchInputValue] = useState('');

      useEffect(() => {
        axios.get(API_BASE + '/properties/catalog/locations').then(res => setCatalog(res.data)).catch(console.error);
      }, []);

      const fetchStats = useCallback(async () => {
        try {
          const res = await axios.get(API_BASE + '/properties/stats/summary');
          setStats(res.data);
        } catch (err) {
          console.error(err);
        }
      }, []);

      useEffect(() => { fetchStats(); }, [fetchStats]);

      const fetchProperties = useCallback(async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          filters.property_types.forEach(t => params.append('property_types', t));
          filters.neighborhoods.forEach(n => params.append('neighborhoods', n));
          filters.zones.forEach(z => params.append('zones', z));
          filters.portals.forEach(p => params.append('portals', p));
          if (filters.min_price !== undefined) params.append('min_price', filters.min_price);
          if (filters.max_price !== undefined) params.append('max_price', filters.max_price);
          if (filters.min_area !== undefined) params.append('min_area', filters.min_area);
          if (filters.max_area !== undefined) params.append('max_area', filters.max_area);
          if (filters.min_bedrooms !== undefined) params.append('min_bedrooms', filters.min_bedrooms);
          if (filters.min_bathrooms !== undefined) params.append('min_bathrooms', filters.min_bathrooms);
          if (filters.days_ago !== undefined) params.append('days_ago', filters.days_ago);
          if (filters.date_filter) params.append('date_filter', filters.date_filter);
          if (filters.search_query) params.append('search_query', filters.search_query);
          if (filters.only_favorites) params.append('only_favorites', 'true');
          if (filters.group_duplicates) params.append('group_duplicates', 'true');
          params.append('sort_by', filters.sort_by);
          params.append('page', filters.page);
          params.append('page_size', filters.page_size);

          const res = await axios.get(API_BASE + '/properties?' + params.toString());
          setProperties(res.data.items);
          setTotal(res.data.total);
          setTotalPages(res.data.total_pages);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      }, [filters]);

      useEffect(() => { fetchProperties(); }, [fetchProperties]);

      const handleSearchSubmit = () => {
        setFilters(prev => ({ ...prev, search_query: searchInputValue, page: 1 }));
      };

      const handleToggleFavorite = async (id) => {
        try {
          const res = await axios.post(API_BASE + '/properties/' + id + '/favorite');
          setProperties(prev => prev.map(p => p.id === id ? { ...p, is_favorite: res.data.is_favorite } : p));
          fetchStats();
        } catch (err) { console.error(err); }
      };

      const handleToggleDiscard = async (id) => {
        try {
          await axios.post(API_BASE + '/properties/' + id + '/discard');
          setProperties(prev => prev.filter(p => p.id !== id));
          setTotal(prev => Math.max(prev - 1, 0));
          fetchStats();
        } catch (err) { console.error(err); }
      };

      const handleSaveNotes = async (id, notes) => {
        try {
          const res = await axios.post(API_BASE + '/properties/' + id + '/notes', { notes });
          setProperties(prev => prev.map(p => p.id === id ? { ...p, user_notes: res.data.user_notes } : p));
        } catch (err) { console.error(err); }
      };

      const handleExportExcel = async () => {
        setIsExporting(true);
        try {
          const params = new URLSearchParams();
          filters.property_types.forEach(t => params.append('property_types', t));
          filters.neighborhoods.forEach(n => params.append('neighborhoods', n));
          filters.portals.forEach(p => params.append('portals', p));
          if (filters.min_price !== undefined) params.append('min_price', filters.min_price);
          if (filters.max_price !== undefined) params.append('max_price', filters.max_price);
          if (filters.date_filter) params.append('date_filter', filters.date_filter);
          if (filters.search_query) params.append('search_query', filters.search_query);

          const response = await axios.get(API_BASE + '/export/excel?' + params.toString(), { responseType: 'blob' });
          const blob = new Blob([response.data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const downloadUrl = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.download = 'inmuebles_exportados_' + new Date().toISOString().slice(0, 10) + '.xlsx';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (err) {
          alert('Error al exportar archivo Excel');
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#ededed] flex flex-col font-sans">
          <header className="bg-[#FFE600] border-b border-yellow-300 shadow-sm sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.location.reload()}>
                <div className="bg-[#2D3277] text-white p-2 rounded-lg font-black text-xl flex items-center gap-1 shadow-sm">
                  <span>🏢 Busca<span className="text-yellow-400">Inmuebles</span></span>
                </div>
                <span className="hidden md:inline-block text-xs font-semibold bg-blue-100 text-blue-900 px-2 py-0.5 rounded-full uppercase">
                  CABA & GBA
                </span>
              </div>

              <div className="flex-1 max-w-2xl flex shadow-sm rounded bg-white border focus-within:ring-2 focus-within:ring-blue-500 overflow-hidden">
                <input
                  type="text"
                  value={searchInputValue}
                  onChange={(e) => setSearchInputValue(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSearchSubmit()}
                  placeholder="Buscar por barrio, calle, inmobiliaria (ej. Palermo 3 amb, Ramos Mejía)..."
                  className="w-full px-4 py-2 text-sm text-gray-800 focus:outline-none"
                />
                <button onClick={handleSearchSubmit} className="px-4 bg-white hover:bg-gray-50 text-gray-600 border-l font-bold">
                  🔍
                </button>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsScrapeModalOpen(true)} className="bg-white hover:bg-gray-50 text-xs font-semibold px-3 py-2 rounded border shadow-sm">
                  🔄 Escanear Portales
                </button>
                <button onClick={handleExportExcel} disabled={isExporting} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded shadow-sm disabled:opacity-50">
                  📊 {isExporting ? 'Exportando...' : 'Exportar Excel'}
                </button>
                <button
                  onClick={() => setFilters(prev => ({ ...prev, only_favorites: !prev.only_favorites, page: 1 }))}
                  className={'text-xs font-semibold px-3 py-2 rounded border shadow-sm ' + (filters.only_favorites ? 'bg-rose-500 text-white' : 'bg-white text-gray-800')}
                >
                  ⭐ Favoritos ({stats?.total_favorites || 0})
                </button>
              </div>
            </div>
            <div className="bg-white/80 border-t px-4 py-1 text-xs text-gray-600 flex justify-between">
              <div>
                <strong>{stats?.total_properties || 0}</strong> inmuebles en base de datos · 
                <span className="text-amber-700 font-semibold ml-1">Mercado Libre ({stats?.by_portal?.mercadolibre || 0})</span>, 
                <span className="text-fuchsia-700 font-semibold ml-1">Zonaprop ({stats?.by_portal?.zonaprop || 0})</span>, 
                <span className="text-red-700 font-semibold ml-1">RE/MAX ({stats?.by_portal?.remax || 0})</span>, 
                <span className="text-blue-700 font-semibold ml-1">Argenprop ({stats?.by_portal?.argenprop || 0})</span>, 
                <span className="text-emerald-700 font-semibold ml-1">Mudafy ({stats?.by_portal?.mudafy || 0})</span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 w-full flex-1 flex flex-col lg:flex-row gap-6 items-start">
            <aside className="w-full lg:w-72 bg-white rounded-lg border p-4 space-y-4 flex-shrink-0 text-xs">
              <div className="flex justify-between items-center border-b pb-2">
                <span className="font-bold text-sm text-gray-900">Filtros</span>
                <button onClick={() => setFilters({ property_types: [], neighborhoods: [], zones: [], portals: [], date_filter: '', sort_by: 'newest', page: 1, page_size: 20 })} className="text-blue-600 hover:underline">
                  Limpiar
                </button>
              </div>

              <div className="bg-amber-50 border border-amber-200 rounded p-2.5">
                <label className="flex items-start gap-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={filters.group_duplicates}
                    onChange={(e) => setFilters(prev => ({ ...prev, group_duplicates: e.target.checked, page: 1 }))}
                    className="mt-0.5 rounded text-blue-600"
                  />
                  <div>
                    <span className="font-bold text-amber-950 block">Detección de Duplicados</span>
                    <span className="text-amber-800 text-[11px] block">Agrupa avisos idénticos y resalta el mejor precio.</span>
                  </div>
                </label>
              </div>

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Inmueble</h4>
                {['departamento', 'casa', 'ph'].map(t => (
                  <label key={t} className="flex items-center justify-between py-0.5 cursor-pointer hover:text-blue-600">
                    <div className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={filters.property_types.includes(t)}
                        onChange={() => {
                          const curr = filters.property_types;
                          setFilters(prev => ({ ...prev, property_types: curr.includes(t) ? curr.filter(x => x !== t) : [...curr, t], page: 1 }));
                        }}
                      />
                      <span className="capitalize font-medium">{t === 'ph' ? 'PH' : t + 's'}</span>
                    </div>
                    <span className="text-gray-400">({stats?.by_type?.[t] || 0})</span>
                  </label>
                ))}
              </div>

              <hr />

              <NeighborhoodSelector
                catalog={catalog}
                selected={filters.neighborhoods}
                onChange={(neighs) => setFilters(prev => ({ ...prev, neighborhoods: neighs, page: 1 }))}
              />

              <hr />

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Precio (USD)</h4>
                <div className="flex items-center gap-1">
                  <input
                    type="number"
                    placeholder="Mín"
                    defaultValue={filters.min_price || ''}
                    onBlur={(e) => setFilters(prev => ({ ...prev, min_price: e.target.value ? parseFloat(e.target.value) : undefined, page: 1 }))}
                    className="w-1/2 p-1 border rounded"
                  />
                  <span>-</span>
                  <input
                    type="number"
                    placeholder="Máx"
                    defaultValue={filters.max_price || ''}
                    onBlur={(e) => setFilters(prev => ({ ...prev, max_price: e.target.value ? parseFloat(e.target.value) : undefined, page: 1 }))}
                    className="w-1/2 p-1 border rounded"
                  />
                </div>
              </div>

              <hr />

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Superficie Total (m²)</h4>
                <div className="flex items-center gap-1">
                  <input
                    type="number"
                    placeholder="Mín m²"
                    defaultValue={filters.min_area || ''}
                    onBlur={(e) => setFilters(prev => ({ ...prev, min_area: e.target.value ? parseFloat(e.target.value) : undefined, page: 1 }))}
                    className="w-1/2 p-1 border rounded"
                  />
                  <span>-</span>
                  <input
                    type="number"
                    placeholder="Máx m²"
                    defaultValue={filters.max_area || ''}
                    onBlur={(e) => setFilters(prev => ({ ...prev, max_area: e.target.value ? parseFloat(e.target.value) : undefined, page: 1 }))}
                    className="w-1/2 p-1 border rounded"
                  />
                </div>
              </div>

              <hr />

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Dormitorios</h4>
                <div className="grid grid-cols-4 gap-1">
                  {[1, 2, 3, 4].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => setFilters(prev => ({ ...prev, min_bedrooms: prev.min_bedrooms === num ? undefined : num, page: 1 }))}
                      className={'py-1 font-semibold rounded border ' + (filters.min_bedrooms === num ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-50')}
                    >
                      {num === 4 ? '4+' : num}
                    </button>
                  ))}
                </div>
              </div>

              <hr />

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Baños</h4>
                <div className="grid grid-cols-3 gap-1">
                  {[1, 2, 3].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => setFilters(prev => ({ ...prev, min_bathrooms: prev.min_bathrooms === num ? undefined : num, page: 1 }))}
                      className={'py-1 font-semibold rounded border ' + (filters.min_bathrooms === num ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-50')}
                    >
                      {num === 3 ? '3+' : num + '+'}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Fecha de Publicación</h4>
                <select
                  value={filters.date_filter || ''}
                  onChange={(e) => setFilters(prev => ({ ...prev, date_filter: e.target.value, page: 1 }))}
                  className="w-full border rounded p-1.5 font-medium bg-white text-gray-800 text-xs focus:ring-1 focus:ring-blue-500"
                >
                  <option value="">Cualquier fecha</option>
                  <option value="last_1">Últimas 24 horas</option>
                  <option value="last_7">Últimos 7 días</option>
                  <option value="last_15">Últimos 15 días</option>
                  <option value="last_30">Últimos 30 días</option>
                  <option value="older_30">Más de 30 días (Antiguos)</option>
                </select>
              </div>

              <hr />

              <div>
                <h4 className="font-bold text-gray-700 uppercase mb-2">Portales</h4>
                {['zonaprop', 'mercadolibre', 'remax', 'argenprop', 'mudafy'].map(p => {
                  const pName = {
                    zonaprop: 'Zonaprop',
                    mercadolibre: 'Mercado Libre',
                    remax: 'RE/MAX',
                    argenprop: 'Argenprop',
                    mudafy: 'Mudafy',
                    cabaprop: 'CabaProp',
                    properati: 'Properati'
                  }[p] || p;
                  return (
                    <label key={p} className="flex items-center justify-between py-0.5 cursor-pointer hover:text-blue-600">
                      <div className="flex items-center gap-2">
                        <input
                          type="checkbox"
                          checked={filters.portals.includes(p)}
                          onChange={() => {
                            const curr = filters.portals;
                            setFilters(prev => ({ ...prev, portals: curr.includes(p) ? curr.filter(x => x !== p) : [...curr, p], page: 1 }));
                          }}
                        />
                        <span>{pName}</span>
                      </div>
                      <span className="text-gray-400">({stats?.by_portal?.[p] || 0})</span>
                    </label>
                  );
                })}
              </div>

            </aside>

                      <span className="hidden sm:inline">Dividido</span>
                    </button>
                    <button
                      type="button"

                      <span className="hidden sm:inline">Mapa</span>
                    </button>
                  </div>

                  <div className="flex items-center gap-1 text-xs">
                    <select
                      value={filters.sort_by}
                      onChange={(e) => setFilters(prev => ({ ...prev, sort_by: e.target.value, page: 1 }))}

                    >

                      <option value="price_asc">Menor precio (USD)</option>
                      <option value="price_desc">Mayor precio (USD)</option>

                      <option value="price_m2_desc">Mayor valor por m²</option>
                      <option value="area_desc">Mayor superficie (m²)</option>

              {loading ? (
                <div className="bg-white rounded-lg border p-12 text-center text-gray-500 font-semibold">

                <div className="bg-white rounded-lg border p-12 text-center text-gray-500 space-y-2">
                  <div className="text-3xl">🏠</div>
                  <h3 className="font-bold">No se encontraron inmuebles con esos filtros</h3>

                <div className="h-[75vh] w-full">
                  <MapView
                    properties={properties}
                    selectedId={selectedPropertyId}
                    onSelect={setSelectedPropertyId}
                    activeNeighborhoods={filters.neighborhoods}

              ) : viewMode === 'split' ? (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
                  <div className="space-y-3 max-h-[80vh] overflow-y-auto pr-1">
                    {properties.map(p => (
                      <PropertyItem
                        key={p.id}
                        property={p}
                        isSelected={p.id === selectedPropertyId}
                        onSelect={setSelectedPropertyId}
                        onToggleFavorite={handleToggleFavorite}
                        onToggleDiscard={handleToggleDiscard}
                        onSaveNotes={handleSaveNotes}
                      />
                    ))}
                  </div>
                  <div className="sticky top-24 h-[80vh]">
                    <MapView
                      properties={properties}
                      selectedId={selectedPropertyId}

                <div className="space-y-3">
                  {properties.map(p => (
                    <PropertyItem
                      key={p.id}
                      property={p}
                      isSelected={p.id === selectedPropertyId}
                      onSelect={setSelectedPropertyId}
                      onToggleFavorite={handleToggleFavorite}
                      onToggleDiscard={handleToggleDiscard}
                      onSaveNotes={handleSaveNotes}

    function NeighborhoodSelector({ catalog, selected, onChange }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [activeZone, setActiveZone] = useState('CABA');
      const zones = Object.keys(catalog);

      const toggleNeigh = (n) => {
        onChange(selected.includes(n) ? selected.filter(x => x !== n) : [...selected, n]);
      };

      const selectAllInActiveZone = () => {
        const list = (catalog[activeZone] || []).filter(n => !search || n.toLowerCase().includes(search.toLowerCase()));
        const set = new Set([...selected, ...list]);
        onChange(Array.from(set));
      };

      const deselectAllInActiveZone = () => {
        const list = (catalog[activeZone] || []).filter(n => !search || n.toLowerCase().includes(search.toLowerCase()));
        onChange(selected.filter(n => !list.includes(n)));
      };

      return (
        <div>
          <div className="flex justify-between items-center mb-1">
            <label className="font-bold text-gray-700 uppercase">Barrios</label>
            {selected.length > 0 && (
              <button onClick={() => onChange([])} className="text-blue-600 hover:underline">
                Limpiar ({selected.length})
              </button>
            )}
          </div>
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="w-full bg-white border rounded p-1.5 text-left flex justify-between items-center"
          >
            <span>{selected.length === 0 ? 'Seleccionar barrios...' : selected.length + ' seleccionados'}</span>
            <span>{isOpen ? '▲' : '▼'}</span>
          </button>
          {selected.length > 0 && (
            <div className="flex flex-wrap gap-1 mt-1 max-h-24 overflow-y-auto p-1 bg-gray-50 rounded border">
              {selected.map(n => (
                <span key={n} className="bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded border text-[11px] flex items-center gap-1">
                  {n}
                  <button onClick={() => toggleNeigh(n)} className="font-bold">×</button>
                </span>
              ))}
            </div>
          )}
          {isOpen && (
            <div className="mt-2 p-2 bg-white border rounded shadow-lg">
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Buscar barrio..."
                className="w-full p-1 border rounded mb-2 text-xs"
              />
              {!search && (
                <div className="flex border-b mb-2 overflow-x-auto text-[11px]">
                  {zones.map(z => (
                    <button
                      key={z}
                      onClick={() => setActiveZone(z)}
                      className={'px-2 py-0.5 font-semibold border-b-2 whitespace-nowrap ' + (activeZone === z ? 'border-blue-600 text-blue-600' : 'text-gray-500')}
                    >
                      {z}
                    </button>
                  ))}
                </div>
              )}
              <div className="flex justify-between items-center mb-2 px-0.5 text-[11px]">
                <button
                  type="button"
                  onClick={selectAllInActiveZone}
                  className="text-blue-700 hover:underline font-semibold"
                >
                  ✓ Seleccionar todos ({activeZone})
                </button>
                <button
                  type="button"
                  onClick={deselectAllInActiveZone}
                  className="text-gray-500 hover:text-red-600"
                >
                  Desmarcar
                </button>
              </div>
              <div className="max-h-40 overflow-y-auto space-y-1">
                {(catalog[activeZone] || []).filter(n => !search || n.toLowerCase().includes(search.toLowerCase())).map(n => (
                  <label key={n} className="flex items-center gap-1.5 p-0.5 hover:bg-gray-50 rounded cursor-pointer text-xs">
                    <input
                      type="checkbox"
                      checked={selected.includes(n)}
                      onChange={() => toggleNeigh(n)}
                      className="rounded text-blue-600"
                    />
                    <span>{n}</span>
                  </label>
                ))}
              </div>
              <div className="mt-2 pt-1 border-t flex justify-end">
                <button onClick={() => setIsOpen(false)} className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs">Listo</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function MapView({ properties, selectedId, onSelect, activeNeighborhoods }) {
      const mapContainerRef = React.useRef(null);
      const mapInstanceRef = React.useRef(null);
      const markersLayerRef = React.useRef(null);
      const markersByIdRef = React.useRef({});

      React.useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [-34.6037, -58.3816],
            zoom: 12,
            zoomControl: true
          });

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          }).addTo(map);

          mapInstanceRef.current = map;
          markersLayerRef.current = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 18,
            disableClusteringAtZoom: 14,
            spiderfyOnMaxZoom: true,
            iconCreateFunction: function (cluster) {
              const count = cluster.getChildCount();
              return L.divIcon({
                html: `<div class="price-pill" style="background-color: #ea580c; padding: 3px 8px; font-size: 11px;">🏠 ${count}</div>`,
                className: 'custom-price-marker',
                iconSize: [46, 26]
              });
            }
          });
          map.addLayer(markersLayerRef.current);
        }

        const map = mapInstanceRef.current;
        const markersGroup = markersLayerRef.current;
        markersGroup.clearLayers();
        markersByIdRef.current = {};

        const bounds = [];

        properties.forEach(p => {
          let lat = p.latitude;
          let lng = p.longitude;

          if (!lat || !lng || isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) {
            const base = NEIGHBORHOOD_COORDS[p.neighborhood] || NEIGHBORHOOD_COORDS["Caballito"] || [-34.6186, -58.4428];
            const seed = p.id || 1;
            const angle = (seed * 137.5) * (Math.PI / 180);
            const radius = 0.0016 + ((seed % 35) / 35) * 0.0065;
            lat = base[0] + Math.sin(angle) * radius;
            lng = base[1] + Math.cos(angle) * radius * 1.35;
          }

          bounds.push([lat, lng]);

          const priceText = formatPricePill(p.price_usd);
          const isSelected = selectedId === p.id;
          const isFav = p.is_favorite;

          const icon = L.divIcon({
            className: 'custom-price-marker',
            html: `<div class="price-pill ${isFav ? 'fav-pill' : ''} ${isSelected ? 'selected-pill' : ''}">${priceText}</div>`,
            iconSize: [75, 26],
            iconAnchor: [37, 13]
          });

          const marker = L.marker([lat, lng], { icon: icon });
          markersByIdRef.current[p.id] = { marker, lat, lng };

          const portalColor = {
            mercadolibre: 'bg-amber-100 text-amber-900 border-amber-300',
            zonaprop: 'bg-fuchsia-100 text-fuchsia-900 border-fuchsia-300',
            argenprop: 'bg-blue-100 text-blue-900 border-blue-300',
            mudafy: 'bg-emerald-100 text-emerald-900 border-emerald-300'
          }[p.portal] || 'bg-gray-100';

          const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80';
          const daysText = formatDaysPublished(p.publication_date || p.scraped_at);

          const popupHtml = `
            <div style="width: 250px; font-family: -apple-system, sans-serif; font-size: 12px; color: #1f2937;">
              <div style="position: relative; height: 130px; background-color: #f3f4f6;">
                <img src="${imgUrl}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80'" />
                <div style="position: absolute; top: 6px; left: 6px; display: flex; gap: 4px;">
                  <span style="font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.9); border: 1px solid #ccc;">${p.portal === 'mercadolibre' ? 'Mercado Libre' : p.portal}</span>
                  <span style="font-size: 9px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 6px; border-radius: 4px;">${p.property_type}</span>
                </div>
                ${p.price_per_m2 ? `<div style="position: absolute; bottom: 6px; left: 6px; background: rgba(15,23,42,0.85); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">USD ${Math.round(p.price_per_m2).toLocaleString()}/m²</div>` : ''}
              </div>
              <div style="padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px;">
                  <span style="font-size: 17px; font-weight: 900; color: #0f172a;">USD ${p.price_usd ? p.price_usd.toLocaleString() : 'Consultar'}</span>
                  ${daysText ? `<span style="font-size: 10px; font-weight: 600; background: #ecfdf5; color: #065f46; padding: 2px 6px; border-radius: 4px; border: 1px solid #a7f3d0;">⏱️ ${daysText}</span>` : ''}
                </div>
                <div style="font-weight: 700; color: #334155; font-size: 11px; margin-bottom: 4px;">📍 ${p.neighborhood || ''} ${p.address ? '· ' + p.address : ''}</div>
                <div style="font-size: 11px; color: #64748b; line-height: 1.25; height: 26px; overflow: hidden; margin-bottom: 6px;">${p.title || ''}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 10px; color: #475569; margin-bottom: 10px;">
                  ${p.total_area_m2 ? `<span style="background: #f1f5f9; padding: 2px 5px; border-radius: 4px;">📐 <strong>${Math.round(p.total_area_m2)}</strong> m² tot</span>` : ''}
                  ${p.covered_area_m2 && p.covered_area_m2 !== p.total_area_m2 ? `<span style="background: #eff6ff; color: #1e40af; padding: 2px 5px; border-radius: 4px; border: 1px solid #dbeafe;">🏠 <strong>${Math.round(p.covered_area_m2)}</strong> m² cub</span>` : ''}
                  ${p.bedrooms !== null ? `<span style="background: #f1f5f9; padding: 2px 5px; border-radius: 4px;">🛏️ <strong>${p.bedrooms}</strong> dorm</span>` : ''}
                  ${p.antiquity ? `<span style="background: #faf5ff; color: #6b21a8; padding: 2px 5px; border-radius: 4px; border: 1px solid #f3e8ff;">🏛️ ${p.antiquity}</span>` : ''}
                  ${p.disposition ? `<span style="background: #fffbeb; color: #92400e; padding: 2px 5px; border-radius: 4px; border: 1px solid #fef3c7;">🏢 ${p.disposition}</span>` : ''}
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 8px;">
                  <a href="${p.url}" target="_blank" rel="noopener noreferrer" style="background: #2563eb; color: #fff; text-decoration: none; font-weight: bold; font-size: 11px; padding: 5px 12px; border-radius: 6px; display: inline-block;">
                    Ver en portal ↗
                  </a>
                </div>
              </div>
            </div>
          `;

          marker.bindPopup(popupHtml);
          marker.on('click', () => {
            if (onSelect) onSelect(p.id);
          });

          markersGroup.addLayer(marker);
        });

        if (selectedId && markersByIdRef.current[selectedId]) {
          const target = markersByIdRef.current[selectedId];
          map.flyTo([target.lat, target.lng], 16, { duration: 0.8 });
          setTimeout(() => {
            target.marker.openPopup();
          }, 850);
        } else if (bounds.length > 0) {
          if (activeNeighborhoods && activeNeighborhoods.length === 1 && NEIGHBORHOOD_COORDS[activeNeighborhoods[0]]) {
            map.setView(NEIGHBORHOOD_COORDS[activeNeighborhoods[0]], 15);
          } else {
            map.fitBounds(bounds, { padding: [35, 35], maxZoom: 16 });
          }
        }

        setTimeout(() => {
          map.invalidateSize();
        }, 200);

      }, [properties, selectedId, activeNeighborhoods]);

      return (
        <div className="relative w-full h-full min-h-[480px] rounded-lg border overflow-hidden shadow-sm bg-gray-100">
          <div ref={mapContainerRef} className="w-full h-full min-h-[480px]" />
        </div>
      );
    }

    function formatDaysPublished(dateStr) {
      if (!dateStr) return null;
      try {
        const pubDate = new Date(dateStr);
        const now = new Date();
        const diffMs = now.getTime() - pubDate.getTime();
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        if (diffDays <= 0) return 'Publicado hoy';
        if (diffDays === 1) return 'Publicado hace 1 día';
        if (diffDays < 30) return `Publicado hace ${diffDays} días`;
        const months = Math.floor(diffDays / 30);
        return `Publicado hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
      } catch (e) {
        return null;
      }
    }

                <div>
                  <div className="flex items-baseline gap-2">
                    <span className="text-2xl font-black text-gray-900">
                      USD {property.price_usd?.toLocaleString()}
                    </span>
                    {daysText && (
                      <span className="text-[11px] font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded">
                        ⏱️ {daysText}
                      </span>
                    )}
                  </div>
                  <div className="font-semibold text-gray-700 mt-0.5">
                    📍 {property.neighborhood}, {property.zone} {property.address && '· ' + property.address}
                  </div>
                </div>
              </div>

              <h3 className="font-medium text-gray-800 line-clamp-1 mt-1 text-sm">{property.title}</h3>

              <div className="flex flex-wrap items-center gap-2 mt-3 text-gray-600">
                {property.total_area_m2 && (
                  <span className="bg-gray-100 px-2 py-1 rounded" title="Superficie Total">

                  </span>

                    🏛️ {property.antiquity}

                )}
                {property.disposition && (
                  <span className="bg-amber-50 text-amber-900 border border-amber-200 px-2 py-1 rounded font-medium" title="Disposición">
                    🏢 {property.disposition}
                  </span>
                )}
                {property.orientation && (
                  <span className="bg-slate-100 text-slate-700 px-2 py-1 rounded text-[11px]" title="Orientación">
                    🧭 {property.orientation}
                  </span>
                )}
                {property.seller_name && <span className="text-gray-500 ml-auto">🏢 {property.seller_name}</span>}
              </div>

              <div className="mt-2">
                {isEditingNote ? (
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={noteText}
                      onChange={(e) => setNoteText(e.target.value)}
                      placeholder="Agregar nota..."
                      className="w-full p-1 border rounded text-xs"
                    />
                    <button onClick={() => { onSaveNotes(property.id, noteText); setIsEditingNote(false); }} className="bg-blue-600 text-white px-2 py-0.5 rounded">
                      Guardar
                    </button>
                  </div>
                ) : (
                  <div className="flex justify-between items-center">
                    {property.user_notes ? (
                      <span className="bg-amber-50 text-amber-900 border border-amber-200 px-2 py-0.5 rounded italic">
                        Nota: {property.user_notes}
                      </span>
                    ) : <span />}
                    <button onClick={() => setIsEditingNote(true)} className="text-gray-400 hover:text-blue-600 ml-auto">
                      {property.user_notes ? '✏️ Editar nota' : '+ Agregar nota'}
                    </button>
                  </div>
                )}
              </div>
            </div>

            <div className="mt-3 pt-2 border-t flex justify-between items-center">
              {dups.length > 1 ? (
                <button
                  onClick={() => setShowDups(!showDups)}
                  className="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 px-2.5 py-1 rounded font-bold flex items-center gap-1"
                >
                  {dups.length} portales detectados {showDups ? '▲' : '▼'}
                </button>
              ) : (
                <span className="text-gray-400 text-[11px]">Publicación única</span>
              )}

              <div className="flex items-center gap-2">
                <button onClick={() => onToggleDiscard(property.id)} className="p-1 text-gray-400 hover:text-rose-600" title="Descartar">
                  🗑️
                </button>
                <a
                  href={property.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded shadow-xs flex items-center gap-1"
                >
                  Ver en portal ↗
                </a>
              </div>
            </div>

            {dups.length > 1 && showDups && (
              <div className="mt-3 p-2 bg-amber-50 rounded border border-amber-200 space-y-1">
                <div className="font-bold text-amber-950">Publicaciones detectadas para este inmueble:</div>
                {dups.map((d, i) => (
                  <div key={i} className="flex justify-between items-center bg-white p-1.5 rounded border border-amber-200">
                    <span className="font-bold uppercase text-[10px]">{d.portal}</span>
                    <span className="font-bold">USD {d.price_usd?.toLocaleString()}</span>
                    <span className="text-gray-500 truncate max-w-[120px]">{d.seller_name}</span>
                    <a href={d.url} target="_blank" rel="noopener noreferrer" className="text-blue-600 font-bold hover:underline">
                      Abrir enlace ↗
                    </a>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ScrapeModalComponent({ isOpen, onClose, onCompleted }) {
      const [portal, setPortal] = useState('all');
      const [jobs, setJobs] = useState([]);
      const [msg, setMsg] = useState(null);
      const [isBusy, setIsBusy] = useState(false);

      const fetchJobs = () => {
        axios.get('/api/scrape/jobs')
          .then(res => setJobs(res.data))
          .catch(console.error);
      };

      useEffect(() => {
        fetchJobs();
        const interval = setInterval(fetchJobs, 2000);
        return () => clearInterval(interval);
      }, []);

      const startScrape = async () => {
        setIsBusy(true);
        setMsg('Iniciando escaneo en segundo plano...');
        try {
          await axios.post('/api/scrape/start', { portal });
          fetchJobs();
          setTimeout(() => {
            fetchJobs();
            onCompleted();
            setIsBusy(false);
          }, 3000);
        } catch (err) {
          setMsg('Error al iniciar escaneo');
          setIsBusy(false);
        }
      };

      const runDedup = async () => {
        try {
          const res = await axios.post('/api/scrape/deduplicate');
          setMsg(res.data.message);
          onCompleted();
        } catch (err) {
          setMsg('Error al ejecutar deduplicación');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-5 space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h2 className="font-bold text-base text-gray-900">Escanear y Actualizar Portales</h2>
              <button onClick={onClose} className="text-gray-500 font-bold text-lg">×</button>
            </div>

            {msg && <div className="p-2 bg-blue-50 text-blue-800 text-xs rounded border border-blue-200">{msg}</div>}

            <div>
              <label className="block text-xs font-bold text-gray-700 mb-1">Seleccionar Portal</label>
              <select value={portal} onChange={(e) => setPortal(e.target.value)} className="w-full text-xs border rounded p-2">
                <option value="all">Todos los Portales (Mercado Libre, Zonaprop, Argenprop, Mudafy)</option>
                <option value="mercadolibre">Mercado Libre</option>
                <option value="zonaprop">Zonaprop</option>
                <option value="argenprop">Argenprop</option>
                <option value="mudafy">Mudafy</option>
              </select>
            </div>

            <div className="flex gap-2">
              <button
                onClick={startScrape}
                disabled={isBusy}
                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-xs disabled:opacity-50"
              >
                {isBusy ? '⏳ Escaneando...' : '▶ Iniciar Escaneo'}
              </button>
              <button
                onClick={runDedup}
                className="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-3 rounded text-xs"
              >
                Detectar Duplicados
              </button>
            </div>

            <div className="pt-2 border-t">
              <div className="flex justify-between items-center mb-2">
                <h4 className="text-xs font-bold text-gray-700">Historial de Escaneos</h4>
                <button onClick={fetchJobs} className="text-[11px] text-blue-600 hover:underline">Actualizar</button>
              </div>
              <div className="max-h-40 overflow-y-auto space-y-1.5 text-xs">
                {jobs.map(j => (
                  <div key={j.id} className="p-2 bg-gray-50 rounded border flex justify-between items-center">
                    <div>
                      <span className="font-bold capitalize">{j.portal}</span>
                      <div className="text-gray-500 text-[11px]">{j.message || j.status}</div>
                    </div>
                    <span className={'px-2 py-0.5 rounded text-[10px] font-bold ' + (j.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800 animate-pulse')}>
                      {j.status === 'completed' ? '✓ Listo' : '⏳ ' + j.status}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex justify-end pt-2 border-t">
              <button onClick={onClose} className="bg-gray-200 px-4 py-1.5 rounded text-xs font-semibold">Cerrar</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
