  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;
    const API_BASE = '/api';

    const NEIGHBORHOOD_COORDS = {

      "San Nicolás": [-34.6050, -58.3800],
      "San Telmo": [-34.6214, -58.3731],

      "Versalles": [-34.6300, -58.5250],
      "Villa Crespo": [-34.5989, -58.4417],
      "Villa del Parque": [-34.6050, -58.4950],
      "Villa Devoto": [-34.6000, -58.5167],
      "Villa General Mitre": [-34.6100, -58.4750],
      "Villa Lugano": [-34.6750, -58.4750],
      "Villa Luro": [-34.6400, -58.5000],
      "Villa Ortúzar": [-34.5800, -58.4700],
      "Villa Real": [-34.6200, -58.5250],
      "Villa Riachuelo": [-34.6900, -58.4600],
      "Villa Santa Rita": [-34.6150, -58.4850],
      "Villa Soldati": [-34.6650, -58.4450],
      "Villa Urquiza": [-34.5724, -58.4900],
      "Villa Pueyrredón": [-34.5800, -58.5050],
      // GBA Norte
      "Vicente López": [-34.5300, -58.4800],
      "Olivos": [-34.5100, -58.4900],
      "Florida": [-34.5350, -58.5000],
      "La Lucila": [-34.4980, -58.4950],
      "Martínez": [-34.4950, -58.5100],
      "Acassuso": [-34.4750, -58.5050],
      "San Isidro": [-34.4700, -58.5200],
      "Béccar": [-34.4550, -58.5350],
      "Tigre": [-34.4260, -58.5796],
      "Nordelta": [-34.4150, -58.6450]
    };

    function App() {
      const [properties, setProperties] = useState([]);
      const [stats, setStats] = useState(null);
      const [catalog, setCatalog] = useState({ CABA: [], 'GBA Norte': [], 'GBA Sur': [], 'GBA Oeste': [] });
      const [loading, setLoading] = useState(true);
      const [total, setTotal] = useState(0);
      const [totalPages, setTotalPages] = useState(1);
      const [selectedId, setSelectedId] = useState(null);
      const [viewMode, setViewMode] = useState('split'); // 'list' | 'split' | 'map'
      const [activeTab, setActiveTab] = useState('explorador');
      const [isScraping, setIsScraping] = useState(false);
      const [scrapeMessage, setScrapeMessage] = useState('');

      const [filters, setFilters] = useState({
        search: '',
        property_types: [],
        operation_type: 'venta',
        neighborhoods: [],
        zones: [],
        portals: [],
        min_price: undefined,
        max_price: undefined,
        min_area: undefined,
        max_area: undefined,
        min_rooms: undefined,
        min_bedrooms: undefined,
        min_bathrooms: undefined,
        has_garage: undefined,
        date_filter: '',
        only_favorites: false,
        group_duplicates: true,
        sort_by: 'newest',
        page: 1,
        page_size: 25
      });

      // Load Catalog & Stats
      const fetchCatalogAndStats = useCallback(async () => {
        try {
          const [catRes, statsRes] = await Promise.all([
            axios.get(`${API_BASE}/properties/locations-catalog`),
            axios.get(`${API_BASE}/properties/stats`)
          ]);
          setCatalog(catRes.data);
          setStats(statsRes.data);
        } catch (err) {
          console.error("Error fetching catalog/stats:", err);
        }
      }, []);

      // Load Properties
      const fetchProperties = useCallback(async () => {
        setLoading(true);
        try {
          const params = {
            search: filters.search || undefined,
            property_type: filters.property_types.length === 1 ? filters.property_types[0] : undefined,
            operation_type: filters.operation_type || undefined,
            neighborhood: filters.neighborhoods.length === 1 ? filters.neighborhoods[0] : undefined,
            zone: filters.zones.length === 1 ? filters.zones[0] : undefined,
            portal: filters.portals.length === 1 ? filters.portals[0] : undefined,
            min_price: filters.min_price || undefined,
            max_price: filters.max_price || undefined,
            min_area: filters.min_area || undefined,
            max_area: filters.max_area || undefined,
            min_rooms: filters.min_rooms || undefined,
            min_bedrooms: filters.min_bedrooms || undefined,
            min_bathrooms: filters.min_bathrooms || undefined,
            has_garage: filters.has_garage || undefined,
            date_filter: filters.date_filter || undefined,
            only_favorites: filters.only_favorites || undefined,
            group_duplicates: filters.group_duplicates,
            sort_by: filters.sort_by,
            page: filters.page,
            page_size: filters.page_size
          };

          const res = await axios.get(`${API_BASE}/properties`, { params });
          let items = res.data.items || [];
          
          // Client-side multi-select filter support
          if (filters.property_types.length > 1) {
            items = items.filter(p => filters.property_types.includes(p.property_type?.toLowerCase()));
          }
          if (filters.neighborhoods.length > 1) {
            items = items.filter(p => filters.neighborhoods.includes(p.neighborhood));
          }
          if (filters.portals.length > 1) {
            items = items.filter(p => filters.portals.includes(p.portal));
          }

          setProperties(items);
          setTotal(res.data.total || 0);
          setTotalPages(res.data.total_pages || 1);
        } catch (err) {
          console.error("Error fetching properties:", err);
        } finally {
          setLoading(false);
        }
      }, [filters]);

      useEffect(() => {
        fetchCatalogAndStats();
      }, [fetchCatalogAndStats]);

      useEffect(() => {
        fetchProperties();
      }, [fetchProperties]);

      // Actions
      const toggleFavorite = async (id) => {
        try {
          const res = await axios.post(`${API_BASE}/properties/${id}/favorite`);
          setProperties(prev => prev.map(p => p.id === id ? { ...p, is_favorite: res.data.is_favorite } : p));
          fetchCatalogAndStats();
        } catch (err) {
          console.error("Error toggling favorite:", err);
        }
      };

      const toggleDiscard = async (id) => {
        try {
          await axios.post(`${API_BASE}/properties/${id}/discard`);
          setProperties(prev => prev.filter(p => p.id !== id));
          fetchCatalogAndStats();
        } catch (err) {
          console.error("Error discarding property:", err);
        }
      };

      const saveNotes = async (id, notes) => {
        try {
          await axios.put(`${API_BASE}/properties/${id}/notes`, { notes });
          setProperties(prev => prev.map(p => p.id === id ? { ...p, user_notes: notes } : p));
        } catch (err) {
          console.error("Error saving notes:", err);
        }
      };

      const handleTriggerScraper = async () => {
        setIsScraping(true);
        setScrapeMessage('Iniciando escaneo de portales en segundo plano...');
        try {
          await axios.post(`${API_BASE}/scraper/jobs`, { portal: 'all', property_type: 'ph', zone: 'capital-federal' });
          setScrapeMessage('Escaneo iniciado con éxito. Los resultados se actualizarán automáticamente.');
          setTimeout(() => {
            fetchCatalogAndStats();
            fetchProperties();
            setIsScraping(false);
            setScrapeMessage('');
          }, 4000);
        } catch (err) {
          setScrapeMessage('Error al iniciar escaneo.');
          setIsScraping(false);
        }
      };

      const handleExport = () => {
        window.open(`${API_BASE}/export/excel`, '_blank');
      };

      return (
        <div className="min-h-screen bg-background text-on-surface flex flex-col font-body-md">
          {/* Top Fixed Header */}
          <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
            <div class="h-28 w-full flex flex-col">
              {/* Tier 1 Header */}
              <div class="h-16 px-margin flex items-center justify-between gap-gutter">
                <div class="flex items-center gap-space-lg shrink-0">
                  <div class="flex items-center gap-space-sm cursor-pointer" onClick={() => setFilters({ property_types: [], neighborhoods: [], zones: [], portals: [], date_filter: '', sort_by: 'newest', page: 1, page_size: 25 })}>
                    <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center">
                      <span class="material-symbols-outlined text-secondary-container text-[20px]">apartment</span>
                    </div>
                    <div class="flex flex-col leading-none">
                      <div class="flex items-center gap-1">
                        <span class="font-headline-md text-headline-md text-on-surface tracking-tight font-extrabold">Busca<span class="text-secondary">Inmuebles</span></span>
                        <span class="font-label-sm text-label-sm px-1.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed">AR</span>
                      </div>
                      <span class="font-label-sm text-label-sm text-on-surface-variant">Inteligencia Inmobiliaria</span>
                    </div>
                  </div>

                  <div class="h-6 w-[1px] bg-surface-variant hidden lg:block"></div>

                  <button 
                    onClick={() => setFilters(prev => ({ ...prev, zones: prev.zones.length > 0 ? [] : ['CABA'], page: 1 }))}
                    class="hidden sm:flex items-center gap-space-xs bg-surface-container-low hover:bg-surface-container px-3 py-1.5 rounded-full text-on-surface transition-colors"
                  >
                    <span class="material-symbols-outlined text-secondary text-[16px]">near_me</span>
                    <span class="font-label-md text-label-md">{filters.zones.length > 0 ? filters.zones.join(', ') : 'CABA & GBA'}</span>
                    <span class="material-symbols-outlined text-on-surface-variant text-[16px]">expand_more</span>
                  </button>
                </div>

                {/* Central Search Bar */}
                <div class="flex-1 max-w-2xl px-space-md">
                  <div class="relative flex items-center w-full">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]">search</span>
                    <input 
                      class="w-full pl-9 pr-24 py-2 bg-surface rounded-full text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary-container border border-surface-variant/40"
                      placeholder="Buscar por barrio, calle, código postal o ID... (ej. Palermo, Villa Urquiza, USD 120.000)"
                      type="text"
                      value={filters.search}
                      onChange={(e) => setFilters(prev => ({ ...prev, search: e.target.value, page: 1 }))}
                    />
                    <div class="absolute right-1.5 flex items-center gap-1">
                      <span class="hidden md:inline-flex px-1.5 py-0.5 rounded bg-surface-container-high font-metric-mono text-metric-mono text-on-surface-variant">⌘K</span>
                      <button class="px-3 py-1 rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md transition-colors">
                        Buscar
                      </button>
                    </div>
                  </div>
                </div>

                {/* Actions & Profile */}
                <div class="flex items-center gap-space-sm shrink-0">
                  <button 
                    onClick={handleTriggerScraper}
                    disabled={isScraping}
                    class="hidden xl:flex items-center gap-space-xs px-3 py-1.5 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface transition-colors"
                    title="Ejecutar escaneo de portales en segundo plano"
                  >
                    <span class={`material-symbols-outlined text-secondary text-[18px] ${isScraping ? 'animate-spin' : ''}`}>sync</span>
                    <span class="font-label-md text-label-md">{isScraping ? 'Escaneando...' : 'Escanear'}</span>
                    <span class="w-2 h-2 rounded-full bg-secondary-container"></span>
                  </button>

                  <button 
                    onClick={handleExport}
                    class="hidden md:flex items-center gap-space-xs px-3 py-1.5 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface transition-colors"
                    title="Exportar base de datos a archivo Excel"
                  >
                    <span class="material-symbols-outlined text-secondary text-[18px]">table_view</span>
                    <span class="font-label-md text-label-md">Exportar</span>
                  </button>

                  <button 
                    onClick={() => setFilters(prev => ({ ...prev, only_favorites: !prev.only_favorites, page: 1 }))}
                    class={`flex items-center gap-space-xs px-3 py-1.5 rounded-lg transition-colors ${filters.only_favorites ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-surface-container-low hover:bg-surface-container text-on-surface'}`}
                    title="Filtrar solo favoritos"
                  >
                    <span class="material-symbols-outlined text-secondary text-[18px]">favorite</span>
                    <span class="w-5 h-5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center">
                      {stats?.total_favorites || 0}
                    </span>
                  </button>

                  <div class="h-6 w-[1px] bg-surface-variant"></div>
                  <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center cursor-pointer shadow-xs">
                    <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                  </div>
                </div>
              </div>

              {/* Tier 2 Header (Stats & Tabs) */}
              <div class="h-12 px-margin bg-surface-container-low flex items-center justify-between gap-gutter overflow-x-auto border-t border-surface-variant/30">
                <div class="flex items-center gap-space-sm shrink-0">
                  <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-secondary text-[16px]">database</span>
                    <span class="font-metric-mono text-metric-mono text-on-surface">{stats?.total_properties?.toLocaleString() || '6.070'}</span>
                    <span class="font-body-sm text-body-sm text-on-surface-variant">inmuebles auditados</span>
                  </div>
                  <span class="text-on-surface-variant font-label-sm text-label-sm">•</span>

                      <p className="mt-2 font-bold text-gray-700">No se encontraron propiedades con esos filtros.</p>
                    </div>
                  ) : (
                    properties.map(p => (
                      <StitchPropertyCard
                        key={p.id}
                        property={p}
                        isSelected={selectedId === p.id}
                        onSelect={(id) => setSelectedId(id)}
                        onToggleFavorite={toggleFavorite}
                        onToggleDiscard={toggleDiscard}
                        onSaveNotes={saveNotes}
                      />
                    ))
                  )}
                </div>
              )}

              {/* Pagination Strip */}
              <section class="w-full mt-space-lg flex flex-col sm:flex-row items-center justify-between gap-space-md p-space-md bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant/30">

                  Mostrando página <span class="font-bold text-on-surface">{filters.page}</span> de <span class="font-bold text-on-surface">{totalPages}</span> ({total.toLocaleString()} propiedades)
                </div>
                
                <div class="flex items-center gap-1">
                  <button 
                    disabled={filters.page <= 1}
                    onClick={() => setFilters(prev => ({ ...prev, page: Math.max(1, prev.page - 1) }))}

                    <span class="material-symbols-outlined text-[18px]">chevron_left</span>

                    {filters.page}

                  <button 
                    disabled={filters.page >= totalPages}
                    onClick={() => setFilters(prev => ({ ...prev, page: Math.min(totalPages, prev.page + 1) }))}
                    class="w-9 h-9 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface-variant flex items-center justify-center transition-colors disabled:opacity-40"
                  >
                    <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                  </button>
                </div>

                <div class="flex items-center gap-2">
                  <span class="font-label-sm text-label-sm text-on-surface-variant">Por página:</span>
                  <select 
                    value={filters.page_size}
                    onChange={(e) => setFilters(prev => ({ ...prev, page_size: parseInt(e.target.value), page: 1 }))}
                    class="px-2.5 py-1 bg-surface-container text-on-surface font-metric-mono text-metric-mono rounded-lg focus:outline-none cursor-pointer border border-surface-variant/40"
                  >

                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="150">150</option>
                  </select>
                </div>
              </section>
            </main>
          </div>
        </div>
      );

    // Interactive Leaflet Map Component
    function MapView({ properties, selectedId, onSelect, activeNeighborhoods }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersClusterGroupRef = useRef(null);
      const markersByIdRef = useRef({});

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [-34.5800, -58.4800],
            zoom: 13,
            zoomControl: true
          });

          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
          }).addTo(map);

          const clusterGroup = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 35,
            spiderfyOnMaxZoom: true,
            iconCreateFunction: function(cluster) {
              const count = cluster.getChildCount();
              return L.divIcon({
                html: `<div style="background-color: #ff5a00; color: #fff; font-weight: 800; font-size: 11px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); border: 2px solid #fff;">${count}</div>`,
                className: 'marker-cluster-custom',
                iconSize: L.point(32, 32)
              });
            }
          });

          map.addLayer(clusterGroup);
          mapInstanceRef.current = map;
          markersClusterGroupRef.current = clusterGroup;
        }

        const map = mapInstanceRef.current;
        const markersGroup = markersClusterGroupRef.current;
        markersGroup.clearLayers();
        markersByIdRef.current = {};

        const bounds = [];

        properties.forEach(p => {
          let lat = p.latitude;
          let lng = p.longitude;

          if (!lat || !lng || isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
            const fallback = NEIGHBORHOOD_COORDS[p.neighborhood] || [-34.6037, -58.3816];
            const randLat = (Math.random() - 0.5) * 0.008;
            const randLng = (Math.random() - 0.5) * 0.008;
            lat = fallback[0] + randLat;
            lng = fallback[1] + randLng;
          }

          bounds.push([lat, lng]);

          let priceText = 'Consultar';
          if (p.price_usd) {
            const valK = Math.round(p.price_usd / 1000);
            priceText = `USD ${valK}K`;
          }

          const isFav = p.is_favorite;
          const isSelected = selectedId === p.id;

          const icon = L.divIcon({
            className: 'custom-price-marker',
            html: `<div class="price-pill ${isFav ? 'fav-pill' : ''} ${isSelected ? 'selected-pill' : ''}">${priceText}</div>`,
            iconSize: [75, 26],
            iconAnchor: [37, 13]
          });

          const marker = L.marker([lat, lng], { icon: icon });
          markersByIdRef.current[p.id] = { marker, lat, lng };

          const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80';
          const daysText = formatDaysPublished(p.publication_date || p.scraped_at);

          const popupHtml = `
            <div style="width: 250px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; color: #1f2937;">
              <div style="position: relative; height: 130px; background-color: #f3f4f6;">
                <img src="${imgUrl}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80'" />
                <div style="position: absolute; top: 6px; left: 6px; display: flex; gap: 4px;">
                  <span style="font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.9); border: 1px solid #ccc; text-transform: uppercase;">${p.portal}</span>
                  <span style="font-size: 9px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 6px; border-radius: 4px;">${p.property_type}</span>
                </div>
                ${p.price_per_m2 ? `<div style="position: absolute; bottom: 6px; left: 6px; background: rgba(15,23,42,0.85); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">USD ${Math.round(p.price_per_m2).toLocaleString()}/m²</div>` : ''}
              </div>
              <div style="padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px;">
                  <span style="font-size: 17px; font-weight: 900; color: #0f172a;">USD ${p.price_usd ? p.price_usd.toLocaleString() : 'Consultar'}</span>
                  ${daysText ? `<span style="font-size: 10px; font-weight: 600; background: #ecfdf5; color: #065f46; padding: 2px 6px; border-radius: 4px; border: 1px solid #a7f3d0;">⏱️ ${daysText}</span>` : ''}
                </div>
                <div style="font-weight: 700; color: #334155; font-size: 11px; margin-bottom: 4px;">📍 ${p.neighborhood || ''} ${p.address ? '· ' + p.address : ''}</div>
                <div style="font-size: 11px; color: #64748b; line-height: 1.25; height: 26px; overflow: hidden; margin-bottom: 6px;">${p.title || ''}</div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 8px;">
                  <a href="${p.url}" target="_blank" rel="noopener noreferrer" style="background: #000000; color: #fff; text-decoration: none; font-weight: bold; font-size: 11px; padding: 5px 12px; border-radius: 6px; display: inline-block;">
                    Ver en portal ↗
                  </a>
                </div>
              </div>
            </div>
          `;

          marker.bindPopup(popupHtml);
          marker.on('click', () => {
            if (onSelect) onSelect(p.id);
          });

          markersGroup.addLayer(marker);
        });

        if (selectedId && markersByIdRef.current[selectedId]) {
          const target = markersByIdRef.current[selectedId];
          map.flyTo([target.lat, target.lng], 16, { duration: 0.8 });
          setTimeout(() => {
            target.marker.openPopup();
          }, 850);
        } else if (bounds.length > 0) {
          if (activeNeighborhoods && activeNeighborhoods.length === 1 && NEIGHBORHOOD_COORDS[activeNeighborhoods[0]]) {
            map.setView(NEIGHBORHOOD_COORDS[activeNeighborhoods[0]], 15);
          } else {
            map.fitBounds(bounds, { padding: [35, 35], maxZoom: 16 });
          }
        }

        setTimeout(() => {
          map.invalidateSize();
        }, 200);

      }, [properties, selectedId, activeNeighborhoods]);

      return (
        <div className="relative w-full h-full min-h-[480px] rounded-xl border border-surface-variant/30 overflow-hidden shadow-sm bg-gray-100">
          <div ref={mapContainerRef} className="w-full h-full min-h-[480px]" />
        </div>
      );
    }

    // Searchable Neighborhood Selector Component
    function NeighborhoodSelector({ catalog, selected, onChange }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedZone, setSelectedZone] = useState('CABA');

      const currentNeighborhoods = catalog[selectedZone] || [];
      const filtered = currentNeighborhoods.filter(n =>
        n.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const toggleNeighborhood = (n) => {
        if (selected.includes(n)) {
          onChange(selected.filter(x => x !== n));
        } else {
          onChange([...selected, n]);
        }
      };

      return (
        <div className="space-y-space-xs">
          <div className="flex justify-between items-center">
            <span className="font-label-md text-label-md text-on-surface uppercase tracking-wide">Barrios</span>
            {selected.length > 0 && (
              <button onClick={() => onChange([])} className="text-[11px] text-blue-600 hover:underline">
                Limpiar ({selected.length})
              </button>
            )}
          </div>

          <div className="relative">
            <button
              type="button"
              onClick={() => setIsOpen(!isOpen)}
              className="w-full p-2 border border-surface-variant/40 rounded-lg text-left bg-surface flex justify-between items-center text-xs font-semibold"
            >
              <span className="truncate">
                {selected.length === 0 ? 'Todos los barrios' : `${selected.length} seleccionados`}
              </span>
              <span className="material-symbols-outlined text-[16px] text-gray-500">
                {isOpen ? 'expand_less' : 'expand_more'}
              </span>
            </button>

            {isOpen && (
              <div className="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-50 p-2 text-xs">
                {/* Zone selector */}
                <div className="flex gap-1 mb-2 overflow-x-auto pb-1 border-b">
                  {Object.keys(catalog).map(z => (
                    <button
                      key={z}
                      type="button"
                      onClick={() => setSelectedZone(z)}
                      className={`px-2 py-1 rounded text-[11px] font-bold whitespace-nowrap transition-colors ${selectedZone === z ? 'bg-primary text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}
                    >
                      {z}
                    </button>
                  ))}
                </div>

                <input
                  type="text"
                  placeholder="Filtrar barrio..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full p-1.5 border rounded-md mb-2 text-xs bg-gray-50 focus:outline-none focus:ring-1 focus:ring-secondary-container"
                />

                <div className="max-h-48 overflow-y-auto space-y-1">
                  {filtered.map(n => (
                    <label key={n} className="flex items-center gap-2 p-1 hover:bg-gray-50 rounded cursor-pointer">
                      <input
                        type="checkbox"
                        checked={selected.includes(n)}
                        onChange={() => toggleNeighborhood(n)}
                        className="rounded text-primary cursor-pointer"
                      />
                      <span>{n}</span>
                    </label>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function formatDaysPublished(dateStr) {
      if (!dateStr) return null;
      try {
        const pubDate = new Date(dateStr);
        const now = new Date();
        const diffMs = now.getTime() - pubDate.getTime();
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        if (diffDays <= 0) return 'Publicado hoy';
        if (diffDays === 1) return 'Publicado hace 1 día';
        if (diffDays < 30) return `Publicado hace ${diffDays} días`;
        const months = Math.floor(diffDays / 30);
        return `Publicado hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
      } catch {
        return null;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
